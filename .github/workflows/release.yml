name: MIUIX Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布 tag（留空则自动生成 <commitCount>-<shortSha>）'
        required: false
        type: string
      prerelease:
        description: '标记为预发布'
        required: false
        type: boolean
        default: false
      disable_r8:
        description: '关闭 R8 混淆（R8 出错时用于排查）'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - '*'
    branches:
      - main
    # 只对代码改动自动发版；纯文档/CI 改动跳过，避免刷版
    paths-ignore:
      - '**.md'
      - '.github/**'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: write

# 同一分支只保留最新一次发版，避免连续 push 时并发抢同一个 tag
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      # CI 在国外，走官方源比阿里云镜像快
      USE_CN_MIRROR: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # AGP 9.4.1 + Gradle 9.6.0 需要 JDK 22
      - name: Setup Java 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'

      # MIUIX 0.9.4 要求 compileSdk >= 37；包名是 android-37.2（不存在 android-37）
      # 不用 android-actions/setup-android@v3：其 license 步骤在 runner 上会 exit 1
      - name: Install SDK 37.2 / build-tools 37.0.0
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          fi
          echo "using: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-37.2" "build-tools;37.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 从 secrets 还原签名材料到 local.properties
      # 需要配置 4 个 secret：KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::未配置 KEYSTORE_BASE64，将用 debug 签名出包"
            echo "signed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "signed=true" >> $GITHUB_OUTPUT

      - name: Write local.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNED: ${{ steps.keystore.outputs.signed }}
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            if [ "$SIGNED" = "true" ]; then
              echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
            fi
          } > local.properties

      - name: Build release APK
        run: |
          if [ "${{ inputs.disable_r8 }}" = "true" ]; then
            ./gradlew assembleRelease -PdisableR8=true --stacktrace
          else
            ./gradlew assembleRelease --stacktrace
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Collect APKs
        id: apks
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/ 2>/dev/null || true
          cp app/build/outputs/apk/debug/*.apk out/ 2>/dev/null || true
          ls -lh out/
          echo "count=$(ls out/*.apk 2>/dev/null | wc -l)" >> $GITHUB_OUTPUT

      - name: Resolve version
        id: ver
        run: |
          COUNT=$(git rev-list HEAD --count)
          SHA=$(git rev-parse --short HEAD)
          TAG="${{ inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              TAG="${{ github.ref_name }}"
            else
              TAG="${COUNT}-${SHA}"
            fi
          fi
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts 2>/dev/null || echo "$SHA")
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "resolved tag=$TAG (commitCount=$COUNT sha=$SHA)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: out/*.apk
          body: |
            ## c001apk-compose-plus

            MIUIX 全量 UI 迁移版本。

            | 项 | 值 |
            |---|---|
            | 版本 | `${{ steps.ver.outputs.tag }}` |
            | 提交 | `${{ steps.ver.outputs.sha }}` |
            | 提交数 | `${{ steps.ver.outputs.count }}` |
            | 签名 | ${{ steps.keystore.outputs.signed == 'true' && 'release（已签名）' || 'debug' }} |

            ### 版本矩阵
            - Kotlin 2.4.20 / Compose 1.12.1 / AGP 9.4.1 / Gradle 9.6.0
            - MIUIX 0.9.4（YuKongA/Miuix）
            - compileSdk 37 / minSdk 24

            > 自动构建，未做运行时验证。详见仓库内 `BUILD_NOTES.md`。
