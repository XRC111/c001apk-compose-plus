name: MIUIX Build

# push main 的编译验证由 MIUIX Release 一并完成（它也会跑 compileDebugKotlin），
# 这里只负责 PR 预检和手动验证，避免同一提交重复构建。
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # CI 在国外，走官方源比阿里云镜像快
      USE_CN_MIRROR: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # AGP 9.4.1 + Gradle 9.6.0 需要 JDK 22
      # （原 workflow 用 17，会无法运行 Gradle 9.6.0）
      - name: Setup Java 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'

      # 不用 android-actions/setup-android@v3：该 action 的 license 步骤
      # 在 runner 自带的 sdkmanager 上会 exit 1 失败。
      # GitHub ubuntu-latest runner 已预装 Android SDK，直接调用其 sdkmanager 即可。
      - name: Install SDK 37.2 / build-tools 37.0.0
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          fi
          echo "using: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-37.2" "build-tools;37.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 关键验证目标：Kotlin 源码编译
      - name: Compile Kotlin
        run: ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: c001apk-compose-plus-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            build/reports/
          if-no-files-found: ignore
