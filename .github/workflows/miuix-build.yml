name: MIUIX Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # CI 在国外，走官方源比阿里云镜像快
      USE_CN_MIRROR: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # AGP 9.4.1 + Gradle 9.6.0 需要 JDK 22
      # （原 workflow 用 17，会无法运行 Gradle 9.6.0）
      - name: Setup Java 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # MIUIX 0.9.4 的 AAR metadata 要求 compileSdk >= 37
      # 注意：包名是 android-37.2，不存在 android-37
      - name: Install SDK 37.2 / build-tools 37.0.0
        run: |
          sdkmanager --install "platforms;android-37.2" "build-tools;37.0.0"
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 关键验证目标：Kotlin 源码编译
      - name: Compile Kotlin
        run: ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: c001apk-compose-plus-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            build/reports/
          if-no-files-found: ignore
