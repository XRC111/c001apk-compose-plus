name: Build HarmonyOS HAP

# c001apk HarmonyOS 原生 (ArkTS/ArkUI) 构建。
# 复用与 PiliPlus 仓库相同的公开 SDK 安装脚本（6.1 系列，多镜像回退，无需 secret）。
# 产物：ohos/entry/build/default/outputs/default/entry-default-unsigned.hap（未签名）。
"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ohos/**'
      - 'scripts/harmony/**'
      - '.github/workflows/build-harmonyos.yml'

jobs:
  harmonyos:
    name: HarmonyOS HAP (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # 6.1 系列；小版本不敏感，按可用性回退（HF 镜像 + 华为云镜像）
      HOS_SDK_URLS: >-
        https://huggingface.co/csukuangfj/harmonyos-commandline-tools/resolve/main/commandline-tools-linux-x64-6.1.1.280.zip
        https://huggingface.co/csukuangfj/harmonyos-commandline-tools/resolve/main/commandline-tools-linux-x64-6.1.1.300.zip
        https://huggingface.co/csukuangfj/harmonyos-commandline-tools/resolve/main/commandline-tools-linux-x64-6.0.1.251.zip
        https://repo.huaweicloud.com/harmonyos/ohpm/5.1.0/commandline-tools-linux-x64-5.1.0.840.zip

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: 恢复工具链缓存
        uses: actions/cache@v4
        with:
          path: ~/hos-sdk.pkg
          key: hos-sdk-6.1-v1
          restore-keys: |
            hos-sdk-

      - name: 安装鸿蒙 SDK（公开直链，多镜像回退）
        run: bash scripts/harmony/setup-sdk.sh

      - name: 安装 ohpm 依赖
        working-directory: ohos
        run: |
          set -euo pipefail
          if [ -f oh-package.json5 ]; then
            ohpm install --all 2>&1 || {
              echo "::warning::根 ohpm install 失败，尝试仅 entry 模块"
            }
          fi
          cd entry
          ohpm install --all 2>&1 || echo "::warning::entry ohpm install 未成功（可能无三方依赖）"

      - name: 诊断工具链与工程结构
        working-directory: ohos
        run: |
          set -uo pipefail
          echo "===== hvigorw 位置 ====="
          command -v hvigorw || true
          echo "===== hvigorw --version ====="
          hvigorw --version 2>&1 | head -20 || true
          echo "===== 工程 hvigor 配置 ====="
          cat hvigor/hvigor-config.json5 || true
          echo "===== 工程文件清单 ====="
          ls -la . hvigor 2>/dev/null || true
          echo "===== SDK 顶层 ====="
          ls -1 "$DEVECO_SDK_HOME" 2>/dev/null || true
          echo "===== SDK 内 hvigor 相关 ====="
          find "$DEVECO_SDK_HOME" -maxdepth 3 -iname '*hvigor*' 2>/dev/null | head -20 || true
          echo "===== 工具根目录 ====="
          TOOLROOT=$(dirname "$DEVECO_SDK_HOME")
          ls -1 "$TOOLROOT" 2>/dev/null || true
          echo "===== 工具 node / hvigor 版本 ====="
          ls -1 "$TOOLROOT/tool/node/bin" 2>/dev/null || true
          find "$TOOLROOT" -maxdepth 4 -name "package.json" -path "*hvigor*" 2>/dev/null | head -10 || true

      - name: 构建 HAP
        working-directory: ohos
        run: |
          set -uo pipefail
          echo "DEVECO_SDK_HOME=$DEVECO_SDK_HOME"
          TOOLROOT=$(dirname "$DEVECO_SDK_HOME")

          echo "===== 工具版本 ====="
          cat "$TOOLROOT/version.txt" 2>/dev/null || true
          node -v || true

          echo "===== SDK 的 hvigorw 脚本 ====="
          HVIGORW=$(command -v hvigorw)
          echo "HVIGORW=$HVIGORW"
          head -60 "$HVIGORW" 2>/dev/null || true

          echo "===== 定位 00303024 抛错点 ====="
          FFILE=$(grep -rln 'need to be upgraded' "$TOOLROOT/hvigor" 2>/dev/null | head -1)
          if [ -n "${FFILE:-}" ]; then
            echo "FILE=$FFILE"
            grep -o '.\{0,240\}00303024.\{0,500\}' "$FFILE" 2>/dev/null | head -2 || true
            grep -o '.\{0,160\}need to be upgraded.\{0,400\}' "$FFILE" 2>/dev/null | head -2 || true
          fi

          echo "===== SDK/default 结构 ====="
          find "$DEVECO_SDK_HOME/default" -maxdepth 2 -type d 2>/dev/null | head -20 || true

          echo "===== 工程结构对照（标准 DevEco 应有 hvigor-wrapper.js / hvigorw.bat） ====="
          ls -la hvigor/ . 2>/dev/null || true

          echo "===== 用 SDK 内 hvigor 直接跑（绕过 wrapper） ====="
          hvigorw --help 2>&1 | head -30 || true
          hvigorw clean --no-daemon 2>&1 | tail -20 || true
          hvigorw assembleHap --mode module -p product=default -p debuggable=false --no-daemon 2>&1 | tail -60 || true

          echo "--- HAP 产物 ---"
          find . -name "*.hap" -type f | head -20 || true
          HAPS=$(find . -name "*.hap" -type f | wc -l | tr -d ' ')
          echo "hap_count=$HAPS"
          if [ "$HAPS" -eq 0 ]; then
            echo "::error::构建未产出 HAP"
            exit 1
          fi

      - name: 上传 HAP
        uses: actions/upload-artifact@v4
        with:
          name: c001apk-harmony-hap
          path: ohos/**/*.hap
          if-no-files-found: warn
