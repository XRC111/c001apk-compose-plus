<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<style>
  html, body {
    font: 15px -apple-system, "HarmonyOS Sans", sans-serif;
    margin: 0; padding: 16px;
    color: #333; background: #F5F5F7;
  }
  #status { font-size: 13px; color: #8A8A8E; margin-bottom: 12px; min-height: 18px; }
  #captcha { margin-top: 4px; }
</style>
</head>
<body>
<div id="status">正在准备验证组件…</div>
<div id="captcha"></div>
<script>
  var _timeout = null;

  function statusText(t) {
    document.getElementById('status').innerText = t;
  }

  /**
   * 由 ArkTS 侧在页面加载完成后调用，传入服务端下发的 captchaId。
   * 与 Android 版 CaptchaActivity.buildHtml 使用同一套易盾接入协议。
   */
  function startCaptcha(captchaId) {
    statusText('正在加载验证组件…');
    _timeout = setTimeout(function () {
      statusText('验证组件加载超时，请返回重试');
    }, 15000);

    var script = document.createElement('script');
    script.src = 'https://cstaticdun.126.net/load.min.js';
    script.onerror = function () {
      clearTimeout(_timeout);
      statusText('验证组件加载失败，请检查网络后重试');
    };
    script.onload = function () {
      if (typeof initNECaptcha !== 'function') {
        clearTimeout(_timeout);
        statusText('验证组件不可用，请返回重试');
        return;
      }
      try {
        initNECaptcha({
          captchaId: captchaId,
          element: '#captcha',
          protocol: 'https',
          mode: 'embed',
          apiVersion: 2,
          width: Math.min(320, window.innerWidth - 32) + 'px',
          lang: 'zh-CN',
          onVerify: function (err, data) {
            if (!err && data && data.validate) {
              clearTimeout(_timeout);
              statusText('验证通过');
              if (window.CaptchaBridge && window.CaptchaBridge.onVerified) {
                window.CaptchaBridge.onVerified(data.validate);
              }
            } else {
              statusText('验证未通过，请按提示重试');
            }
          }
        }, function () {
          clearTimeout(_timeout);
        }, function () {
          clearTimeout(_timeout);
          statusText('请按提示完成人机验证');
        });
      } catch (e) {
        clearTimeout(_timeout);
        statusText('验证组件初始化失败，请返回重试');
      }
    };
    document.head.appendChild(script);
  }
</script>
</body>
</html>
